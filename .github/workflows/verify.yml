name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run verification
        shell: bash
        run: |
          set +e
          npm run verify > /tmp/quiz-tsi-verify.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Verification failed. Relevant output:"
            tail -n 180 /tmp/quiz-tsi-verify.log
            exit "$status"
          fi
          tail -n 40 /tmp/quiz-tsi-verify.log
